name: Deploy GitRank to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows:
      - GitTop Automated Scraper & 12-Hour Sync
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate dataset
        run: npm run check:data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Python tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Build Web Application
        run: npm run build

      - name: Build per-developer share pages (Open Graph preview cards)
        run: python scripts/build_share_pages.py public/data/committers.json dist

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages Action
        id: deployment
        uses: actions/deploy-pages@v4
