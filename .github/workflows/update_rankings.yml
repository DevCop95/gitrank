name: GitTop Automated Scraper & Daily Sync

on:
  schedule:
    # Se ejecuta automáticamente cada 5 horas (4-5 veces al día)
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run fast tests or the next country batch
        required: true
        default: test
        type: choice
        options:
          - test
          - batch

permissions:
  contents: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fast Unit Tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Run 100% Real GitHub Multithreaded Scraper
        if: github.event_name == 'schedule' || inputs.run_mode != 'test'
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          SCRAPE_MODE: ${{ github.event_name == 'schedule' && 'batch' || inputs.run_mode }}
        run: |
          python -u scripts/build_fast_multithreaded_real_stats.py

      - name: Commit and Push Updated Data
        if: github.event_name == 'schedule' || inputs.run_mode != 'test'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/committers.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update top committers dataset 100% real [skip ci]" && git push)
