name: GitTop Automated Scraper & 12-Hour Sync

on:
  push:
    branches:
      - main
      - master
    # Only scraper changes re-run the scrape; front-end pushes must not burn API quota
    paths:
      - scripts/**
      - .github/workflows/update_rankings.yml
  schedule:
    # Se ejecuta automáticamente cada 12 horas
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run fast tests or the next country batch
        required: true
        default: test
        type: choice
        options:
          - test
          - batch

permissions:
  contents: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fast Unit Tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Run 100% Real GitHub Multithreaded Scraper
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'test'
        env:
          GIT_TOKEN: ${{ vars.GIT_TOKEN }}
          SCRAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode || 'batch' }}
        run: |
          python -u scripts/build_fast_multithreaded_real_stats.py

      - name: Commit and Push Updated Data
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'test'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/committers.json
          git status
          if git diff --quiet && git diff --staged --quiet; then
            echo "No dataset changes to commit"
            exit 0
          fi
          git commit -m "chore(data): auto-update top committers dataset 100% real"
          # Someone may have pushed while the scraper ran: rebase and retry instead of failing
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          exit 1
