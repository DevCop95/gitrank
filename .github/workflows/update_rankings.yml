name: GitTop Automated Scraper & Daily Sync

on:
  schedule:
    # Se ejecuta automáticamente cada 5 horas (4-5 veces al día)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 100% Real GitHub Multithreaded Scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_fast_multithreaded_real_stats.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/committers.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update top committers dataset 100% real [skip ci]" && git push)
